name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android project
        run: |
          mkdir -p mobile/www
          cp index.html mobile/www/
          cd mobile
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          curl -fsSL https://cdn.tailwindcss.com -o www/tailwind.js
          sed -i 's|https://cdn.tailwindcss.com|tailwind.js|g' www/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text()
          splash="""<style>
          #fp-splash{position:fixed;inset:0;z-index:2147483647;background:radial-gradient(ellipse at 50% 40%,#123e31,#050b0a 70%);display:grid;place-items:center;color:#e6c77c;transition:opacity .45s;overflow:hidden}
          #fp-splash .mark{text-align:center;animation:fp-in 1.1s ease both}
          #fp-splash .wallet{font-size:72px;filter:drop-shadow(0 0 24px #d4af3777)}
          #fp-splash h1{font-size:28px;letter-spacing:3px;margin:18px 0;color:#f4e6bc}
          #fp-splash small{font-family:cursive;font-style:italic;font-size:16px}
          #fp-splash i{position:absolute;width:3px;height:3px;border-radius:50%;background:#e6c77c;box-shadow:0 0 10px #e6c77c;animation:fp-float 1.8s ease-in-out infinite alternate}
          @keyframes fp-in{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
          @keyframes fp-float{from{opacity:.15;transform:translateY(15px)}to{opacity:.9;transform:translateY(-20px)}}
          @media(prefers-reduced-motion:reduce){#fp-splash *{animation:none!important}}
          </style><div id="fp-splash"><div class="mark"><svg width="120" height="120" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg"><rect width="108" height="108" rx="24" fill="#101520"/><rect x="19" y="25" width="65" height="43" rx="8" fill="#AF8D11" transform="rotate(-12 51 46)"/><rect x="17" y="38" width="69" height="43" rx="8" fill="#12654b" stroke="#E9C349"/><path d="M18 50H85" stroke="#4EDEA3" stroke-width="6"/><rect x="26" y="61" width="13" height="9" rx="2" fill="#E9C349"/><circle cx="78" cy="77" r="19" fill="#E9C349" stroke="#AF8D11" stroke-width="3"/><path d="M75 65V87Q86 86 86 77M70 74L81 70M70 80L81 76" fill="none" stroke="#493900" stroke-width="2.5" stroke-linecap="round"/></svg><h1>FİNANS PANELİM</h1><small>Erdi Toklu tarafından geliştirildi</small></div></div><script>
          (()=>{const e=document.getElementById('fp-splash');for(let i=0;i<24;i++){let p=document.createElement('i');p.style.left=(Math.random()*100)+'%';p.style.top=(Math.random()*100)+'%';p.style.animationDelay=(Math.random()*1.2)+'s';e.appendChild(p)};setTimeout(()=>{e.style.opacity='0';setTimeout(()=>e.remove(),450)},1800);document.addEventListener('click',x=>{if(x.target.closest('button')&&navigator.vibrate)navigator.vibrate(12)})})();
          </script>"""
          import re
          s=re.sub(r'(<body[^>]*>)',lambda m:m.group(1)+splash,s,count=1)
          s=re.sub(r'<link href="https://fonts.googleapis.com[^"]*"[^>]*>','',s)
          s=s.replace('</head>', '<style>body,.app-shell{background:#0B0E14!important;color:#E6E8F0}.app-header{border-bottom:1px solid #2B3447;padding:20px}.app-header h1,.tab-content>h2,.tab-content>div>h2{font-family:Georgia,serif;font-size:22px}.app-content{padding-inline:20px}.glass-panel,.glass-card,.summary-tile{background:#192030!important;border:1px solid #2B3447!important;border-radius:16px!important}.debt-hero{min-height:180px;background:radial-gradient(ellipse at top right,#234c3e,transparent 70%),linear-gradient(135deg,#192030,#101520)!important;border:1px solid #AF8D11!important;border-radius:20px}.debt-amount{font-family:Georgia,serif;color:#FFB3AF;letter-spacing:-1px}.debt-track span{background:#4EDEA3}.summary-tile[data-tone=amber]{--tone:#E9C349}.summary-tile[data-tone=mint]{--tone:#4EDEA3}.summary-tile[data-tone=lilac]{--tone:#E6E8F0}.app-nav{background:#101520ed!important;border-color:#2B3447!important}.nav-btn.active{background:#4EDEA31a!important;color:#4EDEA3!important}.text-blue-400,.text-blue-500{color:#4EDEA3!important}.bg-blue-600{background:#4EDEA3!important;color:#003824!important}.text-slate-400{color:#A8B3C4!important}#modal-sheet{background:#141A28!important}input,select{border-color:#2B3447!important}button{transition:transform .12s,background .12s}button:active{transform:scale(.97)}[class*="card-theme-"]{border-radius:20px!important;box-shadow:0 12px 24px #0006!important;background-image:linear-gradient(115deg,#ffffff16,transparent 40%,#ffffff09 65%,transparent 80%),linear-gradient(135deg,var(--card-a,#334155),var(--card-b,#101520))!important}.card-theme-enpara{--card-a:#56318b;--card-b:#211638}.card-theme-akbank{--card-a:#9c3544;--card-b:#390f1c}.card-theme-garanti{--card-a:#147456;--card-b:#092e24}.card-theme-yapakredi{--card-a:#34568d;--card-b:#101c3b}</style></head>',1)
          s=re.sub(r'<svg class="brand-mark"[\\s\\S]*?</svg>',lambda m:'<svg class="brand-mark" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg"><rect width="108" height="108" rx="24" fill="#101520"/><rect x="19" y="25" width="65" height="43" rx="8" fill="#AF8D11" transform="rotate(-12 51 46)"/><rect x="17" y="38" width="69" height="43" rx="8" fill="#12654b" stroke="#E9C349"/><path d="M18 50H85" stroke="#4EDEA3" stroke-width="6"/><rect x="26" y="61" width="13" height="9" rx="2" fill="#E9C349"/><circle cx="78" cy="77" r="19" fill="#E9C349" stroke="#AF8D11" stroke-width="3"/><path d="M75 65V87Q86 86 86 77M70 74L81 70M70 80L81 76" fill="none" stroke="#493900" stroke-width="2.5" stroke-linecap="round"/></svg>',s,count=1)
          s=s.replace('</body>', "<style>\n#metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.debt-hero{min-height:210px;align-items:center}.debt-hero-content{width:100%}.debt-amount{font-size:clamp(28px,8vw,42px)}.summary-tile:last-child{grid-column:1/-1}.summary-tile{padding:16px;min-height:80px}.app-nav .nav-btn{width:19%;min-width:0}.app-nav{padding-inline:5px}.app-header h1{color:#E9C349!important}.v4-title{font:26px Georgia,serif;color:#E6E8F0;margin:8px 0 16px}.v4-kicker{font-size:10px;letter-spacing:3px;color:#4EDEA3;text-transform:uppercase}.v4-sign{font:italic 20px Georgia,serif;color:#E9C349;text-align:center;padding:24px}.v4-card-strip{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding-bottom:10px}.v4-card-strip>article{flex:0 0 88%;scroll-snap-align:start}.v4-card-strip>article>div:nth-child(4),.v4-card-strip>article>div:last-child{display:none}.v4-card-strip>article{min-height:175px}.v4-card-strip>article:after{content:\"••••  ••••  ••••\";display:block;color:#ffffff99;letter-spacing:3px;margin-top:16px}.v4-history #history{max-height:none}.v4-history #history>div{padding:16px 10px;background:#192030;border-color:#2B3447}.v4-actions{display:grid!important;grid-template-columns:repeat(4,1fr);background:transparent!important;border:0!important;padding:0!important}.v4-actions button{background:#192030;border:1px solid #2B3447;border-radius:16px;margin:3px;padding:12px 0}.v4-actions button>div{background:#4EDEA314!important;color:#4EDEA3!important;border:0!important}#tab-accounts #accounts>div{padding:18px;background:#101520;border-radius:18px}#tab-settings button{min-height:64px}#tab-cards article{padding:20px}#tab-cards article>div:nth-child(2){margin-top:28px}#tab-cards article>div:nth-child(2)>div:last-child{font-family:Georgia,serif;font-size:30px}\n</style><script>\ndocument.addEventListener(\"DOMContentLoaded\",()=>{\nconst home=document.getElementById(\"tab-home\"),main=document.querySelector(\".app-content\"),nav=document.querySelector(\".app-nav\");\nhome.insertAdjacentHTML(\"afterbegin\",'<div><div class=\"v4-kicker\">Kişisel finans</div><h2 class=\"v4-title\">Finansal görünüm</h2></div>');\nconst preview=document.getElementById(\"cards-preview-container\");preview.classList.add(\"v4-card-strip\");document.getElementById(\"metrics\").nextElementSibling.classList.add(\"v4-actions\");\nconst hist=document.getElementById(\"history\").closest(\"section\");const tab=document.createElement(\"div\");tab.id=\"tab-history\";tab.className=\"tab-content hidden v4-history space-y-4\";tab.innerHTML='<div class=\"v4-kicker\">Hesap hareketleri</div><h2 class=\"v4-title\">İşlem geçmişi</h2>';tab.append(hist);main.append(tab);\nconst b=document.createElement(\"button\");b.id=\"nav-tab-history\";b.className=\"nav-btn flex flex-col items-center justify-center space-y-1 text-slate-400\";b.innerHTML='<svg width=\"21\" height=\"21\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l4 2\"/></svg><span class=\"text-[10px] font-medium\">Geçmiş</span>';b.onclick=()=>switchTab(\"tab-history\");nav.insertBefore(b,document.getElementById(\"nav-tab-settings\"));\ndocument.querySelector(\"#tab-settings footer\").className=\"v4-sign\";document.querySelector(\"#tab-settings footer\").textContent=\"Erdi Toklu\";\ndocument.querySelector(\"#nav-tab-home span\").textContent=\"Ana Sayfa\";\n});\n</script>"+'</body>',1)
          s=s.replace('</body>', "<style>\n.app-shell{height:100dvh!important;padding-top:32px;padding-bottom:28px}.app-header{padding:10px 18px!important}.app-header h1{font-size:19px!important}.brand-mark{width:36px;height:36px}.app-nav{bottom:28px!important;height:64px!important}.app-content{padding:12px 16px 84px!important}.v4-title{font-size:23px;margin:4px 0 8px}.debt-hero{min-height:0!important;padding:18px!important}.debt-hero-content{display:grid;grid-template-columns:1fr 78px;align-items:center;gap:6px}.debt-hero h2,.debt-amount{grid-column:1}.debt-limit{grid-column:1/-1;margin-top:6px}.v5-ring{grid-column:2;grid-row:1/3;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#4EDEA3 var(--pct),#30394a 0);position:relative}.v5-ring:before{content:\"\";position:absolute;inset:7px;border-radius:50%;background:#18242b}.v5-ring span{position:relative;font-size:14px;color:#4EDEA3}.summary-tile{min-height:0!important;padding:12px!important}.summary-tile:last-child{grid-column:auto!important}#metrics{grid-template-columns:repeat(2,minmax(0,1fr))!important}.v4-actions{display:none!important}.v4-card-strip>article{min-height:150px!important}.v4-card-strip>article:after{display:none}.v5-chip{width:34px;height:25px;border-radius:6px;background:linear-gradient(135deg,#fff0a8,#aa812e);border:1px solid #e9c349;display:inline-block;vertical-align:middle;margin-right:12px}.v5-card-number{letter-spacing:3px;color:#ffffffb0;font-size:13px}.v5-card-face{margin-top:16px}.v5-filter{width:100%;padding:12px;border-radius:12px;background:#192030;color:#eee;border:1px solid #30394a}.v5-account-summary{padding:18px;border-radius:18px;background:#192030;border:1px solid #30394a}.v5-account-summary strong{font:28px Georgia,serif;color:#FFB3AF}.v5-account-summary progress{width:100%;accent-color:#4EDEA3}\n</style><script>\ndocument.addEventListener(\"DOMContentLoaded\",()=>{\nconst home=document.getElementById(\"tab-home\"),metrics=document.getElementById(\"metrics\"),preview=document.getElementById(\"cards-preview-container\");\nhome.querySelector(\".v4-title\").textContent=\"Varlık görünümü\";\nconst cards=preview.closest(\"section\");metrics.after(cards);\nconst account=document.getElementById(\"tab-accounts\");const summary=document.createElement(\"div\");summary.className=\"v5-account-summary\";account.children[0].after(summary);\nconst history=document.getElementById(\"tab-history\");const filter=document.createElement(\"select\");filter.className=\"v5-filter\";filter.innerHTML='<option value=\"\">Tüm işlemler</option><option value=\"kart\">Kart işlemleri</option><option value=\"ek hesap\">Ek hesap</option><option value=\"ödeme\">Ödemeler</option><option value=\"harcama\">Harcamalar</option>';history.children[1].after(filter);\nconst apply=()=>{document.querySelectorAll(\"#history>div\").forEach(el=>{el.hidden=!!filter.value&&!el.textContent.toLocaleLowerCase(\"tr\").includes(filter.value)})};filter.onchange=apply;\nconst decorate=()=>{const hero=metrics.querySelector(\".debt-hero-content\");if(hero&&!hero.querySelector(\".v5-ring\")){const debt=data.cards.reduce((s,c)=>s+num(c.debt),0),limit=data.cards.reduce((s,c)=>s+num(c.limit),0),used=data.accounts.reduce((s,a)=>s+num(a.used),0),pct=limit?Math.round(debt/limit*100):0;hero.querySelector(\"h2\").textContent=\"Toplam güncel borç\";hero.querySelector(\".debt-amount\").textContent=money(debt+used);hero.insertAdjacentHTML(\"beforeend\",'<div class=\"v5-ring\" style=\"--pct:'+Math.max(0,Math.min(100,pct))+'%\"><span>%'+pct+'</span></div>');metrics.insertAdjacentHTML(\"beforeend\",'<article class=\"summary-tile\" data-tone=\"mint\"><span>Kullanılabilir kart limiti</span><strong>'+money(Math.max(0,limit-debt))+'</strong></article>');}\ndocument.querySelectorAll(\"#cards-preview-container article,#cards-full-container article\").forEach(el=>{if(!el.querySelector(\".v5-card-face\"))el.children[0].insertAdjacentHTML(\"afterend\",'<div class=\"v5-card-face\"><span class=\"v5-chip\"></span><span class=\"v5-card-number\">•••• •••• ••••</span></div>')});\nconst used=data.accounts.reduce((s,a)=>s+num(a.used),0),limit=data.accounts.reduce((s,a)=>s+num(a.limit),0);summary.innerHTML='<div class=\"v4-kicker\">Toplam kullanılan ek hesap</div><strong>'+money(used)+'</strong><progress max=\"'+Math.max(1,limit)+'\" value=\"'+Math.max(0,used)+'\"></progress><div> Kullanılabilir: '+money(Math.max(0,limit-used))+'</div>';apply();};\nconst original=render;render=function(){original();decorate()};decorate();\n});\n</script>"+'</body>',1)
          p.write_text(s)
          PY
          npx cap init "Finans Panelim" com.erditoklu.finanspanelim --web-dir www
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/res/drawable/finans_icon.xml')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#101520" android:pathData="M0,0H108V108H0Z"/><path android:fillColor="#AF8D11" android:pathData="M18,30L80,18L88,60L26,72Z"/><path android:fillColor="#12654B" android:pathData="M17,38H86V81H17Z"/><path android:fillColor="#4EDEA3" android:pathData="M17,48H86V54H17Z"/><path android:fillColor="#E9C349" android:pathData="M26,61H39V70H26Z M78,58A19,19 0,1 1,78 96A19,19 0,1 1,78 58"/><path android:strokeColor="#493900" android:strokeWidth="2.5" android:fillColor="#00000000" android:pathData="M75,65V87Q86,86 86,77M70,74L81,70M70,80L81,76"/></vector>')
          m=Path('android/app/src/main/AndroidManifest.xml')
          t=m.read_text().replace('@mipmap/ic_launcher_round','@drawable/finans_icon').replace('@mipmap/ic_launcher','@drawable/finans_icon')
          m.write_text(t)
          PY
      - name: Build debug APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Finans-Panelim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Finans-Panelim-APK
          path: Finans-Panelim.apk
